name: Apply approved prices

# Runs when a monthly price-check PR (price-check.yml) is merged into main:
# sends each new price-updates.json to the site's token-protected endpoint
# (POST /api/admin/prices/apply) — a dry run first, then the real call.
# Rows whose live price changed since the check are skipped, never overwritten;
# any skipped row fails the job so it shows up for a manual look.
#
# Secrets: PRICE_APPLY_TOKEN (same value as the server's env var).
# Variables (optional): PRICE_APPLY_URL (defaults to https://www.healthwise360.co.uk).

on:
  push:
    branches: [main]
    paths:
      - "price-updates/**/price-updates.json"
  workflow_dispatch:
    inputs:
      file:
        description: "Path of the price-updates.json to apply"
        required: true
      dry_run:
        description: "Dry run only"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: price-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Find the approved update files
        id: files
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          INPUT_FILE: ${{ inputs.file }}
        run: |
          if [ -n "$INPUT_FILE" ]; then
            files="$INPUT_FILE"
          else
            files=$(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- 'price-updates/**/price-updates.json')
          fi
          echo "Files: $files"
          echo "list=$(echo $files)" >> "$GITHUB_OUTPUT"

      - name: Apply
        if: steps.files.outputs.list != ''
        env:
          PRICE_APPLY_TOKEN: ${{ secrets.PRICE_APPLY_TOKEN }}
          SITE_URL: ${{ vars.PRICE_APPLY_URL || 'https://www.healthwise360.co.uk' }}
          FILES: ${{ steps.files.outputs.list }}
          DRY_ONLY: ${{ inputs.dry_run }}
        run: |
          if [ -z "$PRICE_APPLY_TOKEN" ]; then
            echo "::error::PRICE_APPLY_TOKEN secret is not set"; exit 1
          fi
          status=0
          for f in $FILES; do
            echo "::group::$f (dry run)"
            node scripts/price-scraper/apply.mjs --file="$f" --url="$SITE_URL" --dry-run || status=$?
            echo "::endgroup::"
            if [ "$DRY_ONLY" = "true" ]; then continue; fi
            echo "::group::$f (apply)"
            node scripts/price-scraper/apply.mjs --file="$f" --url="$SITE_URL" || status=$?
            echo "::endgroup::"
          done
          exit $status
