name: SEO check

# Task 31 Phase 1 — Layer 1 (pull-request check). Builds the site on this
# runner (never touches Hostinger), runs seo:export/seo:validate against that
# local build, and fails the job if any ERROR is found on a prototype URL.
# With branch protection on main, a failing run blocks the merge, so an
# unsafe change never reaches Hostinger. See docs/task-31-seo-automation-plan.md.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  seo-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (public settings only — no passwords or admin credentials)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
        run: npm run build

      - name: Start the built site
        run: |
          npm run start &
          echo $! > next-start.pid
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:3000; then
              echo "Server is up."
              exit 0
            fi
            sleep 1
          done
          echo "Server did not start in time." >&2
          exit 1

      - name: seo:export (local build)
        run: npm run seo:export -- --target=local

      - name: seo:validate
        id: validate
        run: npm run seo:validate

      - name: Stop the built site
        if: always()
        run: kill "$(cat next-start.pid)" 2>/dev/null || true

      - name: Upload SEO reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seo-reports
          path: reports/seo/
          retention-days: 90

      - name: Post summary to the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const path = "reports/seo/seo-summary.md";
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, "utf8");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
